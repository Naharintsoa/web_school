services:
  - type: web
    name: college-sully
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: DATABASE_URL
        sync: false   # à renseigner manuellement dans le dashboard Render
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
