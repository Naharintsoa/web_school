databases:
  - name: college-sully-db
    databaseName: college_sully
    user: college_sully

services:
  - type: web
    name: college-sully
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-sully-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
